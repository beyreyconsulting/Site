# Netlify deployment config — Beyrey Consulting / Kalan (Vite SPA)
#
# Set the two build-time env vars in the Netlify UI (Site settings →
# Environment variables), NOT here — they are public but project-specific:
#   VITE_SUPABASE_URL        = https://<project>.supabase.co
#   VITE_SUPABASE_ANON_KEY   = <anon key>

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback: serve index.html for any non-file path (hash routing means most
# navigation is client-side, but this catches direct hits to /lms, /admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    # If something fails to load, the usual culprit is connect-src / media-src —
    # both are scoped to *.supabase.co (DB, Auth, Edge Functions, signed media).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self'"

# Long-cache hashed build assets (filenames change on every build)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
